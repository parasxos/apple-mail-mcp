name: release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: verify tag and downloaded release packages
        run: python tools/verify_dist.py dist --tag "${GITHUB_REF_NAME}"
      - name: publish to PyPI (trusted publishing)
        # Publisher registered on pypi.org: apple-mailbox-mcp ->
        # parasxos/apple-mail-mcp release.yml. Runs BEFORE checksums are
        # written: twine rejects non-distribution files in dist/
        # (the v1.5.0 run failed on SHA256SUMS). Skips prereleases.
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: write release checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: create GitHub release with installable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          case "${GITHUB_REF_NAME}" in
            *rc[0-9]*) release_flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            "${release_flags[@]}"
