[build-system]
requires = ["setuptools>=77"]  # license = "MIT" is PEP 639; older setuptools rejects it
build-backend = "setuptools.build_meta"

[project]
name = "apple-mail-mcp"
dynamic = ["version"]
description = "Fast local MCP server for Apple Mail: search, read, triage, verified send. Works with Claude, Cursor, VS Code, or any MCP client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["apple-mail", "email", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=1.27.1,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "jsonschema>=4",
    "pytest>=7",
    "setuptools>=77",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/parasxos/email-mcp"
Documentation = "https://github.com/parasxos/email-mcp#readme"
Issues = "https://github.com/parasxos/email-mcp/issues"
Repository = "https://github.com/parasxos/email-mcp"

[project.scripts]
apple-mail-mcp = "email_mcp.cli:main"
apple_mail_mcp = "email_mcp.cli:main"
# Back-compat alias for existing local configs; not advertised.
email-mcp = "email_mcp.cli:main"

[tool.setuptools]
packages = [
    "email_mcp",
    "email_mcp.application",
    "email_mcp.adapters",
    "email_mcp.domain",
    "email_mcp.sources",
    "email_mcp.transports",
]

[tool.setuptools.dynamic]
version = {attr = "email_mcp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
