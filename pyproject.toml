[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-mcp"
version = "0.5.0"
description = "Local MCP server exposing Apple Mail read access + guarded sending for Claude Code."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
email-mcp = "email_mcp.server:main"

[tool.setuptools]
packages = ["email_mcp", "email_mcp.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
