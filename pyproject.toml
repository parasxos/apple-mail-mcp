[build-system]
requires = ["setuptools>=77"]  # license = "MIT" is PEP 639; older setuptools rejects it
build-backend = "setuptools.build_meta"

[project]
name = "email-mcp"
dynamic = ["version"]
description = "Local MCP server exposing Apple Mail read access + guarded sending for Claude Code."
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "setuptools>=68",
]

[project.scripts]
email-mcp = "email_mcp.cli:main"

[tool.setuptools]
packages = ["email_mcp", "email_mcp.sources", "email_mcp.transports"]

[tool.setuptools.dynamic]
version = {attr = "email_mcp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
